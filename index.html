<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Happy Bees Pickleball court organiser: run every court at once with fair rotation.">
<meta name="theme-color" content="#2B679A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Happy Bees">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Happy Bees Pickleball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a club-night console. Courts drawn top-down as the hero grid, bench below, everything else one tab away. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --surface-2: #F5F8F6;
  --ink: #15232A;
  --muted: #5A6B70;
  --line: #D3DDD8;
  --apron: #3D7A5A;
  --apron-ink: #E9F4EE;
  --court: #2B679A;
  --court-line: rgba(255,255,255,.92);
  --ball: #D8EE3A;
  --ball-ink: #1C2606;
  --accent: #23608F;
  --win: #2A7A4B;
  --warn: #A86A12;
  --danger: #B33F2D;
  --shadow: 0 1px 2px rgba(20,35,42,.06), 0 6px 18px rgba(20,35,42,.07);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1518; --surface: #152127; --surface-2: #1A2930; --ink: #E4EDEF; --muted: #93A5AB; --line: #263842;
    --apron: #2C5A44; --apron-ink: #DDEFE5; --court: #275C8A; --court-line: rgba(255,255,255,.85);
    --ball: #D2E83A; --ball-ink: #1C2606; --accent: #86BBE8; --win: #5FC48A; --warn: #E0A84A; --danger: #F08070;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1518; --surface: #152127; --surface-2: #1A2930; --ink: #E4EDEF; --muted: #93A5AB; --line: #263842;
  --apron: #2C5A44; --apron-ink: #DDEFE5; --court: #275C8A; --court-line: rgba(255,255,255,.85);
  --ball: #D2E83A; --ball-ink: #1C2606; --accent: #86BBE8; --win: #5FC48A; --warn: #E0A84A; --danger: #F08070;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding-block: 16px 10px; flex-wrap: wrap; }
.ball { width: 30px; height: 30px; border-radius: 50%; flex: none; background:
  radial-gradient(circle at 30% 30%, var(--ball-ink) 0 2px, transparent 2.5px),
  radial-gradient(circle at 68% 26%, var(--ball-ink) 0 2px, transparent 2.5px),
  radial-gradient(circle at 50% 56%, var(--ball-ink) 0 2px, transparent 2.5px),
  radial-gradient(circle at 24% 70%, var(--ball-ink) 0 2px, transparent 2.5px),
  radial-gradient(circle at 76% 72%, var(--ball-ink) 0 2px, transparent 2.5px),
  var(--ball); opacity: .95; }
.brand { min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
@media (max-width: 440px) { .brand h1 { font-size: 22px; } .sync { display: none; } }
.brand .meta { color: var(--muted); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--win); }
.sync[data-s="busy"]::before { background: var(--warn); }
.sync[data-s="err"]::before { background: var(--danger); }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px 10px; }
.tabs-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .n { font-variant-numeric: tabular-nums; opacity: .7; font-weight: 500; margin-left: 4px; }

/* Generic */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ball); color: var(--ball-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(.96); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.eyebrow { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 15px; margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.banner { border-radius: 12px; padding: 10px 14px; background: var(--surface-2); border: 1px dashed var(--line); font-size: 14px; }
input[type="text"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0; }
textarea { min-height: 120px; resize: vertical; }

/* Courts view */
.courts-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.courts-bar .summary { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.courts-bar .summary b { color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.ccard { background: var(--apron); color: var(--apron-ink); border-radius: 16px; padding: 10px 12px 12px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.chead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cno { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.ctime { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .85; }
.ctime.long { color: var(--ball); opacity: 1; font-weight: 600; }
.court { position: relative; display: grid; grid-template-columns: 1fr 6px 1fr; min-height: 118px; background: var(--court); border: 2px solid var(--court-line); border-radius: 2px; overflow: hidden; }
.side { position: relative; border: 0; background: transparent; color: #fff; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; cursor: pointer; min-width: 0; }
.side::before { content: ""; position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--court-line); }
.side::after { content: ""; position: absolute; top: 50%; border-top: 2px solid var(--court-line); }
.side.a::before { right: 30%; }
.side.a::after { left: 0; right: 30%; }
.side.b::before { left: 30%; }
.side.b::after { right: 0; left: 30%; }
.side:hover, .side:focus-visible { background: rgba(255,255,255,.08); }
.side:disabled { cursor: default; }
.side:disabled:hover { background: transparent; }
.pn { position: relative; z-index: 1; background: rgba(9,24,38,.66); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pn.out { text-decoration: line-through; text-decoration-thickness: 1px; opacity: .8; }
.net { background: repeating-linear-gradient(to bottom, var(--court-line) 0 2px, rgba(255,255,255,.25) 2px 5px); box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.court.empty { grid-template-columns: 1fr; place-items: center; background: color-mix(in srgb, var(--court) 55%, var(--apron)); border-style: dashed; padding: 14px; text-align: center; }
.empty-in { display: grid; gap: 8px; justify-items: center; color: #fff; }
.empty-in .lbl { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 15px; opacity: .85; }
.empty-in .next { font-size: 13px; opacity: .9; }
.cfoot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; opacity: .9; align-items: center; }
.cfoot button { background: rgba(255,255,255,.12); border: 0; color: var(--apron-ink); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.cfoot button:hover { background: rgba(255,255,255,.2); }

.bench { margin-top: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); padding: 5px 10px 5px 6px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
.chip .k { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--line); color: var(--ink); padding: 0 5px; }
.chip.next { background: var(--ball); color: var(--ball-ink); border-color: transparent; }
.chip.next .k { background: var(--ball-ink); color: var(--ball); }
.chip .g { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip.next .g { color: var(--ball-ink); opacity: .7; }
.chip.paused { opacity: .65; border-style: dashed; }

.empty-state { text-align: center; padding: 34px 18px; display: grid; gap: 12px; justify-items: center; }
.empty-state h2 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.05; text-wrap: balance; }
.empty-state p { margin: 0; color: var(--muted); max-width: 46ch; }

/* Players view */
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.plist { display: grid; margin-top: 8px; }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 2px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
.check[aria-pressed="true"] { background: var(--ball); border-color: var(--ball); }
.check[aria-pressed="true"]::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid var(--ball-ink); border-bottom: 2.5px solid var(--ball-ink); transform: rotate(-45deg) translate(1px, -1px); }
.pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pstat { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pstat .on { color: var(--accent); font-weight: 600; }
.prow.off .pname { color: var(--muted); font-weight: 500; }
.pact { display: flex; gap: 4px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.setting { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; }
.setting .spread b { font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper output { min-width: 34px; text-align: center; font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
details[open] summary { margin-bottom: 8px; }

/* Standings */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); border-top: 0; }
th:nth-child(2), td:nth-child(2) { text-align: left; width: 100%; }
th:first-child, td:first-child { text-align: left; color: var(--muted); width: 1%; }
tr.top3 td:nth-child(2) { font-weight: 700; }
th button { all: unset; cursor: pointer; }
th button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.pos { color: var(--win); } .neg { color: var(--danger); }
.log { display: grid; }
.lrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.lrow:first-child { border-top: 0; }
.lrow .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.lrow .what { min-width: 0; }
.lrow .w { font-weight: 700; }
.lrow .l { color: var(--muted); }
.lrow .sc { font-variant-numeric: tabular-nums; font-weight: 600; }

/* Wrap-up */
.hist { display: grid; gap: 8px; }
.hitem { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface-2); }
.hitem summary { color: var(--ink); list-style: none; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hitem summary::-webkit-details-marker { display: none; }
.hitem .sub { color: var(--muted); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
pre.copy { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; max-height: 280px; overflow: auto; user-select: all; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(8,16,20,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; display: grid; gap: 14px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
@media (min-width: 640px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; padding-bottom: 18px; } }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 24px; line-height: 1.1; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.teambtn { border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 14px 10px; cursor: pointer; display: grid; gap: 4px; text-align: center; font-weight: 700; font-size: 16px; min-width: 0; }
.teambtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.teambtn small { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.teambtn:hover { border-color: var(--win); }
.teambtn.sel { border-color: var(--win); background: color-mix(in srgb, var(--win) 14%, var(--surface)); }
.vs { align-self: center; font-family: var(--display); font-weight: 700; color: var(--muted); }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.scores input { text-align: center; font-family: var(--display); font-size: 28px; font-weight: 700; padding: 6px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }
.pick { display: grid; gap: 6px; }
.pick button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.pick button:hover { border-color: var(--accent); }
.pick button .g { color: var(--muted); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: var(--ball); color: var(--ball-ink); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.toast button[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ball" aria-hidden="true"></div>
    <div class="brand">
      <h1>Happy Bees Pickleball</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="top-actions">
      <span class="sync" id="sync" data-s="">This device</span>
      <button class="btn sm" id="undoBtn" data-act="undo" disabled>Undo</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-act="view" data-v="courts" id="tab-courts">Courts</button>
      <button class="tab" role="tab" data-act="view" data-v="players" id="tab-players">Players</button>
      <button class="tab" role="tab" data-act="view" data-v="standings" id="tab-standings">Results</button>
      <button class="tab" role="tab" data-act="view" data-v="wrap" id="tab-wrap">Wrap-up</button>
    </div>
  </nav>

  <div id="banners" class="stack" style="margin-bottom:12px"></div>

  <main>
    <section id="v-courts"></section>

    <section id="v-players" hidden>
      <div class="cols">
        <div class="card">
          <div class="spread">
            <h2 class="eyebrow">Check in</h2>
            <span class="hint" id="inCount"></span>
          </div>
          <form class="add" id="addForm" style="margin-top:12px" autocomplete="off">
            <label class="sr" for="addName">Player name</label>
            <input type="text" id="addName" placeholder="Add a player" maxlength="40">
            <button class="btn dark" type="submit">Add</button>
          </form>
          <details style="margin-top:10px">
            <summary>Paste a list of names</summary>
            <label class="sr" for="pasteBox">Names, one per line</label>
            <textarea id="pasteBox" placeholder="One name per line, or separated by commas"></textarea>
            <div class="row" style="margin-top:8px"><button class="btn sm dark" type="button" data-act="paste">Add and check in</button></div>
          </details>
          <div class="spread" style="margin-top:14px">
            <label class="sr" for="filter">Search players</label>
            <input type="text" id="filter" placeholder="Search" style="max-width:220px">
            <div class="row">
              <button class="btn sm" data-act="checkAll">Check in all</button>
              <button class="btn sm" data-act="checkNone">Check out all</button>
            </div>
          </div>
          <div class="plist" id="plist"></div>
        </div>
        <div class="card" id="settings"></div>
      </div>
    </section>

    <section id="v-standings" hidden></section>
    <section id="v-wrap" hidden></section>
  </main>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" data-act="undo" hidden>Undo</button></div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const CLIENT = uid();
  const LS_STATE = "pkl-rotation-state-v1", LS_HIST = "pkl-rotation-history-v1", LS_VIEW = "pkl-rotation-view";
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const clone = o => JSON.parse(JSON.stringify(o));
  const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtDate = t => new Date(t).toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const SAMPLE = ["Mia","Jack","Chloe","Liam","Ruby","Noah","Zoe","Ethan","Isla","Lucas","Grace","Ollie","Ava","Leo","Harper","Max","Sienna","Archie","Lily","Hugo","Matilda","Finn","Evie","Charlie","Ivy","Tom","Willow","Sam","Georgia","Ben"];

  function blank() {
    return { v: 1, updatedAt: 0, by: "", demo: false, startedAt: Date.now(),
      settings: { courts: 6, mode: "mix", scores: false, autoFill: true },
      roster: [], courts: [null, null, null, null, null, null], matches: [] };
  }
  function normalize(s) {
    const b = blank();
    s.settings = Object.assign(b.settings, s.settings || {});
    s.roster = Array.isArray(s.roster) ? s.roster : [];
    s.matches = Array.isArray(s.matches) ? s.matches : [];
    s.courts = Array.isArray(s.courts) ? s.courts : [];
    while (s.courts.length < s.settings.courts) s.courts.push(null);
    s.courts.length = Math.max(s.settings.courts, 1);
    if (!s.startedAt) s.startedAt = Date.now();
    s.roster.forEach(p => { if (p.seed == null) p.seed = Math.random(); });
    return s;
  }

  let state = (() => { try { const r = lsGet(LS_STATE); return r ? normalize(JSON.parse(r)) : blank(); } catch { return blank(); } })();
  let history = (() => { try { return JSON.parse(lsGet(LS_HIST) || "[]"); } catch { return []; } })();
  let undoStack = [];
  let view = lsGet(LS_VIEW) || "courts";
  let sheet = null;
  let standSort = "wins";
  let filterText = "";
  let readOnly = false;
  let syncMode = "local";

  // ---------- derived ----------
  const nameOf = id => (state.roster.find(p => p.id === id) || {}).name || "Player";
  const teamName = ids => ids.map(nameOf).join(" & ");
  function onCourtMap() {
    const m = new Map();
    state.courts.forEach((c, i) => c && [...c.a, ...c.b].forEach(id => m.set(id, i)));
    return m;
  }
  function computeStats() {
    const S = new Map();
    const get = id => { if (!S.has(id)) S.set(id, { games: 0, wins: 0, losses: 0, pf: 0, pa: 0, scored: 0, lastEnd: 0, partners: new Map(), opps: new Map() }); return S.get(id); };
    state.roster.forEach(p => get(p.id));
    const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
    const rel = (a, b) => a.forEach(x => { const s = get(x); a.forEach(y => { if (y !== x) bump(s.partners, y); }); b.forEach(y => bump(s.opps, y)); });
    for (const m of state.matches) {
      const hasScore = typeof m.sa === "number" && typeof m.sb === "number";
      [[m.a, m.w === "a", m.sa, m.sb], [m.b, m.w === "b", m.sb, m.sa]].forEach(([side, won, pf, pa]) => {
        side.forEach(id => { const s = get(id); s.games++; won ? s.wins++ : s.losses++; if (hasScore) { s.pf += pf; s.pa += pa; s.scored++; } s.lastEnd = Math.max(s.lastEnd, m.endedAt || 0); });
      });
      rel(m.a, m.b); rel(m.b, m.a);
    }
    state.courts.forEach(c => { if (c) { rel(c.a, c.b); rel(c.b, c.a); } });
    return S;
  }
  // Fewest games first, then longest since their last game, then a random seed so the first round is shuffled.
  function waitingList(S, on) {
    return state.roster.filter(p => p.in && !p.paused && !on.has(p.id))
      .sort((x, y) => S.get(x.id).games - S.get(y.id).games || S.get(x.id).lastEnd - S.get(y.id).lastEnd || x.seed - y.seed);
  }
  function combos(n, k) {
    const out = [];
    const rec = (start, acc) => { if (acc.length === k) { out.push(acc.slice()); return; } for (let i = start; i < n; i++) { acc.push(i); rec(i + 1, acc); acc.pop(); } };
    rec(0, []);
    return out;
  }
  const splits = ([w, x, y, z]) => [[[w, x], [y, z]], [[w, y], [x, z]], [[w, z], [x, y]]];
  function teamPenalty(S, a, b) {
    const pc = (x, y) => S.get(x).partners.get(y) || 0;
    const oc = (x, y) => S.get(x).opps.get(y) || 0;
    const partner = pc(a[0], a[1]) + pc(b[0], b[1]);
    let opp = 0; a.forEach(x => b.forEach(y => { opp += oc(x, y); }));
    if (state.settings.mode === "balanced") {
      const r = id => { const s = S.get(id); return (s.wins + 1) / (s.games + 2); };
      return partner * 2 + opp * 0.25 + Math.abs(r(a[0]) + r(a[1]) - r(b[0]) - r(b[1])) * 10;
    }
    return partner * 4 + opp;
  }
  function pickGame(S, list) {
    if (list.length < 4) return null;
    const g4 = S.get(list[3].id).games;
    const must = list.filter(p => S.get(p.id).games < g4);
    const need = 4 - must.length;
    const tier = list.filter(p => S.get(p.id).games === g4).slice(0, Math.max(need, 8 - must.length));
    let best = null;
    for (const idx of combos(tier.length, need)) {
      const four = [...must, ...idx.map(i => tier[i])].map(p => p.id);
      const waitPen = idx.reduce((a, i) => a + i, 0) - need * (need - 1) / 2;
      for (const [a, b] of splits(four)) {
        const pen = waitPen * 1.5 + teamPenalty(S, a, b);
        if (!best || pen < best.pen - 1e-9) best = { pen, a, b };
      }
    }
    return best;
  }
  function placeGame(s, i) {
    const S = computeStats();
    const pick = pickGame(S, waitingList(S, onCourtMap()));
    if (!pick) return false;
    s.courts[i] = { id: uid(), a: pick.a, b: pick.b, startedAt: Date.now() };
    return true;
  }

  // ---------- state changes ----------
  function commit(fn) {
    if (readOnly) { toast("You can view these courts but not change them"); return false; }
    undoStack.push(JSON.stringify(state));
    if (undoStack.length > 40) undoStack.shift();
    fn(state);
    state.updatedAt = Date.now(); state.by = CLIENT;
    persist(); render();
    return true;
  }
  function undo() {
    const prev = undoStack.pop();
    if (!prev || readOnly) return;
    state = normalize(JSON.parse(prev));
    state.updatedAt = Date.now(); state.by = CLIENT;
    persist(); closeSheet(); render(); toast("Undone");
  }
  function fillOpen() {
    const open = state.courts.map((c, i) => c ? -1 : i).filter(i => i >= 0);
    if (!open.length) return toast("Every court already has a game");
    const S = computeStats();
    if (waitingList(S, onCourtMap()).length < 4) return toast("Need at least 4 players waiting to start a game");
    let n = 0;
    commit(s => { open.forEach(i => { if (placeGame(s, i)) n++; }); });
    toast(n === 1 ? "Started 1 game" : `Started ${n} games`, true);
  }
  function fillCourt(i) {
    const S = computeStats();
    if (waitingList(S, onCourtMap()).length < 4) return toast("Need at least 4 players waiting to start a game");
    commit(s => placeGame(s, i));
    toast(`Court ${i + 1} is on`, true);
  }
  function recordResult(i, w, sa, sb) {
    const c = state.courts[i];
    if (!c) return;
    let refilled = false;
    commit(s => {
      s.matches.push({ id: c.id, court: i + 1, a: c.a, b: c.b, w, sa: sa ?? null, sb: sb ?? null, startedAt: c.startedAt, endedAt: Date.now() });
      s.courts[i] = null;
      if (s.settings.autoFill) refilled = placeGame(s, i);
    });
    closeSheet();
    toast(`${teamName(w === "a" ? c.a : c.b)} won on Court ${i + 1}${refilled ? ". Next game is on." : ""}`, true);
  }
  function addNames(names) {
    names = names.map(n => n.trim().replace(/\s+/g, " ")).filter(Boolean);
    if (!names.length) return 0;
    let added = 0;
    commit(s => {
      names.forEach(n => {
        const ex = s.roster.find(p => p.name.toLowerCase() === n.toLowerCase());
        if (ex) { ex.in = true; ex.paused = false; }
        else { s.roster.push({ id: uid(), name: n.slice(0, 40), in: true, paused: false, seed: Math.random() }); added++; }
      });
    });
    return added;
  }
  function loadDemo() {
    commit(s => {
      SAMPLE.forEach(n => { if (!s.roster.some(p => p.name === n)) s.roster.push({ id: uid(), name: n, in: true, paused: false, seed: Math.random(), demo: true }); });
      s.demo = true;
      s.courts.forEach((c, i) => { if (!c) placeGame(s, i); });
    });
    toast("Demo night loaded with 30 sample players");
  }
  function clearDemo() {
    commit(s => {
      const ids = new Set(s.roster.filter(p => p.demo).map(p => p.id));
      s.roster = s.roster.filter(p => !p.demo);
      s.matches = s.matches.filter(m => ![...m.a, ...m.b].some(id => ids.has(id)));
      s.courts = s.courts.map(c => c && [...c.a, ...c.b].some(id => ids.has(id)) ? null : c);
      s.demo = false;
    });
    toast("Demo cleared");
  }

  // ---------- persistence ----------
  let db = null, sessRef = null, writing = false, dirty = false, saveTimer = null;
  function persist() {
    lsSet(LS_STATE, JSON.stringify(state));
    if (sessRef && !readOnly) { dirty = true; setSync("busy"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
  }
  async function flush() {
    if (!sessRef || readOnly || writing || !dirty) return;
    dirty = false; writing = true;
    try {
      await sessRef.set({ updatedAt: state.updatedAt, by: CLIENT, state: clone(state) });
      if (!dirty) setSync("ok");
    } catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument") { readOnly = true; render(); }
      else if (code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") { sessRef = null; syncMode = "local"; setSync(""); }
      else if (code === "quota_exceeded") { setSync("err"); toast("Online storage is full. Saved on this device only."); }
      else { dirty = true; setSync("err"); }
    } finally {
      writing = false;
      if (dirty && sessRef && !readOnly) saveTimer = setTimeout(flush, 900 + Math.random() * 600);
    }
  }
  function setSync(s) {
    const el = $("#sync");
    if (readOnly) { el.dataset.s = ""; el.textContent = "View only"; return; }
    if (syncMode === "local") { el.dataset.s = ""; el.textContent = "Saved on this device"; return; }
    el.dataset.s = s;
    el.textContent = s === "busy" ? "Saving…" : s === "err" ? "Retrying save…" : "Saved";
  }
  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try { db = await window.claude.use("db"); } catch { db = null; }
    if (!db) return;
    try {
      const user = await window.claude.use("user");
      if (user) { const can = await user.can("data.write"); if (can === false) readOnly = true; }
    } catch {}
    syncMode = "cloud";
    sessRef = db.doc("session/current");
    setSync("ok");
    sessRef.onSnapshot(snap => {
      if (!snap.exists) { if (state.updatedAt > 0 && !readOnly) persist(); return; }
      const d = snap.data();
      if (!d || !d.state) return;
      if (d.by !== CLIENT && (d.updatedAt || 0) > (state.updatedAt || 0)) {
        state = normalize(clone(d.state));
        undoStack = [];
        lsSet(LS_STATE, JSON.stringify(state));
        render();
      } else if ((d.updatedAt || 0) < (state.updatedAt || 0) && !readOnly && !dirty) {
        persist();
      }
    }, () => { syncMode = "local"; sessRef = null; setSync(""); });
    db.collection("history").orderBy("endedAt", "desc").limit(100).onSnapshot(q => {
      const cloud = q.docs.map(d => clone(d.data()));
      const ids = new Set(cloud.map(h => h.id));
      const localOnly = history.filter(h => !ids.has(h.id));
      history = [...cloud, ...localOnly].sort((a, b) => b.endedAt - a.endedAt);
      if (view === "wrap") renderWrap();
    }, () => {});
    render();
  }
  async function saveHistory(entry) {
    history = [entry, ...history.filter(h => h.id !== entry.id)];
    lsSet(LS_HIST, JSON.stringify(history.slice(0, 60)));
    if (db && !readOnly) { try { await db.collection("history").doc(entry.id).set(entry); } catch {} }
  }
  async function deleteHistory(id) {
    history = history.filter(h => h.id !== id);
    lsSet(LS_HIST, JSON.stringify(history.slice(0, 60)));
    if (db && !readOnly) { try { await db.collection("history").doc(id).delete(); } catch {} }
    renderWrap();
  }

  // ---------- render ----------
  function render() {
    const on = onCourtMap();
    const inCount = state.roster.filter(p => p.in).length;
    const live = state.courts.filter(Boolean).length;
    $("#meta").textContent = `${fmtDate(state.startedAt)} · ${inCount} checked in · ${state.matches.length} games played`;
    $("#undoBtn").disabled = !undoStack.length || readOnly;
    ["courts", "players", "standings", "wrap"].forEach(v => {
      $("#tab-" + v).setAttribute("aria-selected", String(view === v));
      $("#v-" + v).hidden = view !== v;
    });
    $("#tab-courts").innerHTML = `Courts<span class="n">${live}/${state.courts.length}</span>`;
    $("#tab-players").innerHTML = `Players<span class="n">${inCount}</span>`;
    renderBanners();
    if (!dirty && !writing) setSync("ok");
    if (view === "courts") renderCourts(on);
    if (view === "players") renderPlayers(on);
    if (view === "standings") renderStandings();
    if (view === "wrap") renderWrap();
  }
  function renderBanners() {
    let h = "";
    if (readOnly) h += `<div class="banner">You can watch the courts here, but only the organiser can change them.</div>`;
    if (state.demo) h += `<div class="banner spread"><span><b>Demo night.</b> These are sample players so you can try it out.</span><button class="btn sm" data-act="clearDemo">Clear demo</button></div>`;
    $("#banners").innerHTML = h;
  }
  function elapsed(t) { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 1 ? "Just started" : `${m} min`; }
  function renderCourts(on) {
    const S = computeStats();
    const wait = waitingList(S, on);
    const inPlayers = state.roster.filter(p => p.in);
    const el = $("#v-courts");
    if (!inPlayers.length) {
      el.innerHTML = `<div class="card empty-state">
        <div class="ball" aria-hidden="true" style="width:46px;height:46px"></div>
        <h2>Who's here tonight?</h2>
        <p>Check players in, then start games on all your courts at once. Each court finishes on its own, and the next four from the bench step on.</p>
        <div class="row" style="justify-content:center">
          <button class="btn primary" data-act="view" data-v="players">Check players in</button>
          ${state.roster.length ? "" : `<button class="btn" data-act="demo">Try a demo night</button>`}
        </div></div>`;
      return;
    }
    const open = state.courts.filter(c => !c).length;
    const next = pickGame(S, wait);
    const nextIds = new Set(next ? [...next.a, ...next.b] : []);
    let h = `<div class="courts-bar">
      <div class="summary"><b>${state.courts.length - open}</b> playing · <b>${open}</b> open · <b>${wait.length}</b> waiting</div>
      <div class="row">
        <button class="btn primary" data-act="fillOpen" ${open && wait.length >= 4 ? "" : "disabled"}>${open === state.courts.length ? "Start all courts" : "Fill open courts"}</button>
      </div></div><div class="grid">`;
    state.courts.forEach((c, i) => {
      if (c) {
        const mins = (Date.now() - c.startedAt) / 60000;
        const names = ids => ids.map(id => { const p = state.roster.find(x => x.id === id); const out = p && (!p.in || p.paused); return `<span class="pn${out ? " out" : ""}" title="${out ? "Leaving after this game" : ""}">${esc(nameOf(id))}</span>`; }).join("");
        h += `<article class="ccard" aria-label="Court ${i + 1}">
          <div class="chead"><span class="cno">Court ${i + 1}</span><span class="ctime${mins >= 20 ? " long" : ""}" data-start="${c.startedAt}">${elapsed(c.startedAt)}</span></div>
          <div class="court">
            <button class="side a" data-act="court" data-i="${i}" data-w="a" aria-label="Record result for court ${i + 1}" ${readOnly ? "disabled" : ""}>${names(c.a)}</button>
            <div class="net" aria-hidden="true"></div>
            <button class="side b" data-act="court" data-i="${i}" data-w="b" aria-label="Record result for court ${i + 1}" ${readOnly ? "disabled" : ""}>${names(c.b)}</button>
          </div>
          <div class="cfoot"><span>${readOnly ? "In play" : "Tap the winning side"}</span>${readOnly ? "" : `<button data-act="court" data-i="${i}">Swap · cancel</button>`}</div>
        </article>`;
      } else {
        h += `<article class="ccard" aria-label="Court ${i + 1}">
          <div class="chead"><span class="cno">Court ${i + 1}</span><span class="ctime">Open</span></div>
          <div class="court empty"><div class="empty-in">
            <span class="lbl">Court open</span>
            ${next ? `<span class="next">Next up: ${esc(teamName(next.a))} v ${esc(teamName(next.b))}</span>` : `<span class="next">Waiting for 4 players</span>`}
            ${readOnly ? "" : `<button class="btn primary sm" data-act="fill" data-i="${i}" ${next ? "" : "disabled"}>Start game</button>`}
          </div></div>
          <div class="cfoot"><span>&nbsp;</span></div>
        </article>`;
      }
    });
    h += `</div>`;
    const paused = state.roster.filter(p => p.in && p.paused && !on.has(p.id));
    h += `<div class="card bench">
      <div class="spread"><h2 class="eyebrow">Bench · ${wait.length}</h2><span class="hint">Fewest games plays next. Highlighted players are up next. Tap a name to send them on a break.</span></div>
      <div class="chips">${wait.map((p, k) => `<button class="chip${nextIds.has(p.id) ? " next" : ""}" data-act="pause" data-id="${p.id}" title="Send on a break"><span class="k">${k + 1}</span>${esc(p.name)}<span class="g">${S.get(p.id).games}g</span></button>`).join("") || `<span class="hint">Nobody waiting. Everyone checked in is on court.</span>`}</div>
      ${paused.length ? `<div class="spread" style="margin-top:14px"><h3 class="eyebrow" style="font-size:13px">On a break · ${paused.length}</h3><span class="hint">Tap to bring back</span></div>
      <div class="chips">${paused.map(p => `<button class="chip paused" data-act="pause" data-id="${p.id}">${esc(p.name)}<span class="g">${S.get(p.id).games}g</span></button>`).join("")}</div>` : ""}
    </div>`;
    el.innerHTML = h;
  }
  function renderPlayers(on) {
    const S = computeStats();
    const inCount = state.roster.filter(p => p.in).length;
    $("#inCount").textContent = `${inCount} of ${state.roster.length} checked in`;
    const f = filterText.toLowerCase();
    const list = state.roster.filter(p => !f || p.name.toLowerCase().includes(f))
      .sort((a, b) => (b.in - a.in) || a.name.localeCompare(b.name));
    $("#plist").innerHTML = list.map(p => {
      const s = S.get(p.id);
      let status;
      if (on.has(p.id)) status = `<span class="on">Court ${on.get(p.id) + 1}</span>${!p.in || p.paused ? " · leaving after this game" : ""}`;
      else if (!p.in) status = "Not checked in";
      else if (p.paused) status = "On a break";
      else status = "Waiting";
      return `<div class="prow${p.in ? "" : " off"}">
        <button class="check" data-act="toggleIn" data-id="${p.id}" aria-pressed="${p.in}" aria-label="${p.in ? "Check out" : "Check in"} ${esc(p.name)}"></button>
        <div style="min-width:0"><div class="pname">${esc(p.name)}</div><div class="pstat">${status}${s.games ? ` · ${s.wins}W ${s.losses}L` : ""}</div></div>
        <div class="pact">
          ${p.in ? `<button class="btn sm ghost" data-act="pause" data-id="${p.id}">${p.paused ? "Back in" : "Break"}</button>` : ""}
          <button class="btn sm ghost" data-act="removeAsk" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button>
        </div></div>`;
    }).join("") || `<p class="hint" style="padding:12px 0">${state.roster.length ? "No players match that search." : "Nobody added yet. Add names above, or paste your group list."}</p>`;
    const st = state.settings;
    $("#settings").innerHTML = `<h2 class="eyebrow">Session settings</h2>
      <div class="setting" style="margin-top:6px"><div class="spread"><b>Courts booked</b>
        <div class="stepper"><button class="btn sm" data-act="courts" data-d="-1" aria-label="Fewer courts">−</button><output>${st.courts}</output><button class="btn sm" data-act="courts" data-d="1" aria-label="More courts">+</button></div></div>
        <p class="hint">${st.courts * 4} players on court at once.</p></div>
      <div class="setting"><b>Pairing</b>
        <div class="seg" role="group" aria-label="Pairing"><button data-act="mode" data-m="mix" aria-pressed="${st.mode === "mix"}">Mix it up</button><button data-act="mode" data-m="balanced" aria-pressed="${st.mode === "balanced"}">Even teams</button></div>
        <p class="hint">${st.mode === "mix" ? "Avoids repeating partners and opponents so everyone plays with everyone." : "Pairs strong with weaker players by win rate so games are close. Still avoids repeat partners."}</p></div>
      <div class="setting"><div class="spread"><b>Start next game automatically</b><button class="switch" role="switch" data-act="autoFill" aria-checked="${st.autoFill}" aria-label="Start next game automatically"></button></div>
        <p class="hint">When a result is entered, the next four from the bench go straight onto that court.</p></div>
      <div class="setting"><div class="spread"><b>Record scores</b><button class="switch" role="switch" data-act="scores" aria-checked="${st.scores}" aria-label="Record scores"></button></div>
        <p class="hint">Off: just tap the winners. On: enter the score (e.g. 11–7) for a points +/− column.</p></div>`;
  }
  function standingsRows() {
    const S = computeStats();
    const rows = state.roster.filter(p => S.get(p.id).games > 0 || p.in).map(p => {
      const s = S.get(p.id);
      return { p, ...s, pct: s.games ? s.wins / s.games : 0, pd: s.pf - s.pa };
    });
    const by = {
      wins: (a, b) => b.wins - a.wins || b.pct - a.pct || b.pd - a.pd || a.p.name.localeCompare(b.p.name),
      pct: (a, b) => b.pct - a.pct || b.wins - a.wins || a.p.name.localeCompare(b.p.name),
      games: (a, b) => b.games - a.games || b.wins - a.wins || a.p.name.localeCompare(b.p.name),
      pd: (a, b) => b.pd - a.pd || b.wins - a.wins || a.p.name.localeCompare(b.p.name),
      name: (a, b) => a.p.name.localeCompare(b.p.name)
    };
    return rows.sort(by[standSort] || by.wins);
  }
  function renderStandings() {
    const rows = standingsRows();
    const anyScores = state.matches.some(m => typeof m.sa === "number");
    const sb = (k, label) => `<button data-act="sort" data-k="${k}" aria-pressed="${standSort === k}">${label}</button>`;
    let h = `<div class="cols"><div class="card"><div class="spread"><h2 class="eyebrow">Standings</h2><span class="hint">Tap a heading to sort</span></div>`;
    if (!rows.length) h += `<p class="hint" style="padding:12px 0">Results show up here as games finish.</p>`;
    else h += `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>${sb("name", "Player")}</th><th>${sb("wins", "W")}</th><th>L</th><th>${sb("games", "GP")}</th><th>${sb("pct", "Win %")}</th>${anyScores ? `<th>${sb("pd", "+/−")}</th>` : ""}</tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${i < 3 && standSort !== "name" && r.games ? "top3" : ""}"><td>${i + 1}</td><td>${esc(r.p.name)}</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.games}</td><td>${r.games ? Math.round(r.pct * 100) + "%" : "–"}</td>${anyScores ? `<td class="${r.pd > 0 ? "pos" : r.pd < 0 ? "neg" : ""}">${r.scored ? (r.pd > 0 ? "+" : "") + r.pd : "–"}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>`;
    h += `</div><div class="card"><div class="spread"><h2 class="eyebrow">Match log · ${state.matches.length}</h2></div><div class="log" style="margin-top:6px">`;
    const ms = state.matches.slice().reverse();
    h += ms.map(m => {
      const W = m.w === "a" ? m.a : m.b, L = m.w === "a" ? m.b : m.a;
      const sc = typeof m.sa === "number" ? (m.w === "a" ? `${m.sa}–${m.sb}` : `${m.sb}–${m.sa}`) : "";
      return `<div class="lrow"><div class="when">Court ${m.court}<br>${fmtTime(m.endedAt)}</div>
        <div class="what"><span class="w">${esc(teamName(W))}</span> <span class="l">def.</span> ${esc(teamName(L))}${sc ? ` <span class="sc">${sc}</span>` : ""}</div>
        ${readOnly ? "<span></span>" : `<button class="btn sm ghost" data-act="delMatchAsk" data-id="${m.id}" aria-label="Delete this result">Delete</button>`}</div>`;
    }).join("") || `<p class="hint" style="padding:8px 0">No games finished yet.</p>`;
    h += `</div></div></div>`;
    $("#v-standings").innerHTML = h;
  }
  function summaryText(h) {
    const lines = [`Happy Bees Pickleball · ${fmtDate(h.startedAt)}`, `${h.players.length} players · ${h.matches.length} games`, "", "Standings"];
    h.players.forEach((p, i) => lines.push(`${i + 1}. ${p.name} — ${p.wins}W ${p.losses}L${p.pd != null ? ` (${p.pd > 0 ? "+" : ""}${p.pd})` : ""}`));
    if (h.matches.length) {
      lines.push("", "Games");
      h.matches.forEach(m => lines.push(`Court ${m.court} · ${m.winners} def. ${m.losers}${m.score ? ` ${m.score}` : ""}`));
    }
    return lines.join("\n");
  }
  function snapshotSession() {
    const S = computeStats();
    const anyScores = state.matches.some(m => typeof m.sa === "number");
    const ids = new Set(); state.matches.forEach(m => [...m.a, ...m.b].forEach(id => ids.add(id)));
    state.roster.forEach(p => { if (p.in) ids.add(p.id); });
    const players = [...ids].map(id => { const s = S.get(id) || { wins: 0, losses: 0, games: 0, pf: 0, pa: 0, scored: 0 }; return { name: nameOf(id), wins: s.wins, losses: s.losses, games: s.games, pd: anyScores && s.scored ? s.pf - s.pa : null }; })
      .sort((a, b) => b.wins - a.wins || (a.games ? b.wins / b.games : 0) - (b.games ? a.wins / a.games : 0) || a.name.localeCompare(b.name));
    const matches = state.matches.map(m => ({ court: m.court, winners: teamName(m.w === "a" ? m.a : m.b), losers: teamName(m.w === "a" ? m.b : m.a), score: typeof m.sa === "number" ? (m.w === "a" ? `${m.sa}–${m.sb}` : `${m.sb}–${m.sa}`) : "", endedAt: m.endedAt }));
    return { id: "s" + uid(), startedAt: state.startedAt, endedAt: Date.now(), players, matches };
  }
  function renderWrap() {
    const cur = snapshotSession();
    const top = cur.players.filter(p => p.games).slice(0, 3);
    let h = `<div class="cols"><div class="stack"><div class="card stack">
      <div class="spread"><h2 class="eyebrow">Tonight</h2><span class="hint">${fmtDate(state.startedAt)}</span></div>
      <p style="margin:0">${cur.players.length} players · ${cur.matches.length} games${top.length ? ` · Most wins: ${top.map(p => `${esc(p.name)} (${p.wins})`).join(", ")}` : ""}</p>
      <div class="row">
        <button class="btn dark" data-act="copy">Copy summary</button>
        ${readOnly ? "" : `<button class="btn primary" data-act="newAsk">Save and start new session</button>`}
      </div>
      <div id="copyFallback"></div>
      <p class="hint">Saving keeps tonight's results in History below. Your player list stays; check-ins, games and results reset for next time.</p>
    </div></div>
    <div class="card"><h2 class="eyebrow">History</h2><div class="hist" style="margin-top:10px">`;
    h += history.map(x => `<details class="hitem"><summary><b>${fmtDate(x.startedAt)}</b><span class="sub">${x.players.length} players · ${x.matches.length} games</span></summary>
      <div class="stack" style="margin-top:10px">
        <div class="pstat">${x.players.filter(p => p.games).slice(0, 5).map((p, i) => `${i + 1}. ${esc(p.name)} ${p.wins}W ${p.losses}L`).join("<br>")}</div>
        <div class="row"><button class="btn sm" data-act="copyHist" data-id="${x.id}">Copy summary</button>${readOnly ? "" : `<button class="btn sm ghost danger" data-act="delHistAsk" data-id="${x.id}">Delete</button>`}</div>
      </div></details>`).join("") || `<p class="hint">Saved sessions appear here.</p>`;
    h += `</div></div></div>`;
    $("#v-wrap").innerHTML = h;
  }

  // ---------- sheet ----------
  function openSheet(s) { sheet = s; renderSheet(); $("#backdrop").hidden = false; const f = $("#sheet [autofocus]") || $("#sheet button"); f && f.focus(); }
  function closeSheet() { sheet = null; $("#backdrop").hidden = true; }
  function renderSheet() {
    const el = $("#sheet");
    if (!sheet) return;
    if (sheet.type === "court") {
      const c = state.courts[sheet.i];
      if (!c) return closeSheet();
      if (sheet.mode === "swap") {
        if (!sheet.out) {
          el.innerHTML = `<h3 id="sheetTitle">Court ${sheet.i + 1} · swap who?</h3>
            <div class="pick">${[...c.a, ...c.b].map(id => `<button data-act="swapOut" data-id="${id}">${esc(nameOf(id))}<span class="g">${c.a.includes(id) ? "Left side" : "Right side"}</span></button>`).join("")}</div>
            <div class="sheet-actions"><button class="btn" data-act="sheetBack">Back</button></div>`;
        } else {
          const S = computeStats(), on = onCourtMap();
          const wait = waitingList(S, on);
          const brk = state.roster.filter(p => p.in && p.paused && !on.has(p.id));
          el.innerHTML = `<h3 id="sheetTitle">Replace ${esc(nameOf(sheet.out))}</h3>
            <p class="hint">${esc(nameOf(sheet.out))} goes back to the bench.</p>
            <div class="pick">${[...wait, ...brk].map(p => `<button data-act="swapIn" data-id="${p.id}">${esc(p.name)}<span class="g">${p.paused ? "On a break · " : ""}${S.get(p.id).games} games</span></button>`).join("") || `<p class="hint">Nobody is free to swap in.</p>`}</div>
            <div class="sheet-actions"><button class="btn" data-act="sheetBack">Back</button></div>`;
        }
        return;
      }
      const sel = sheet.w;
      const scores = state.settings.scores;
      el.innerHTML = `<h3 id="sheetTitle">Court ${sheet.i + 1} · who won?</h3>
        <div class="teams">
          <button class="teambtn${sel === "a" ? " sel" : ""}" data-act="win" data-w="a"><small>Left side</small><span>${esc(nameOf(c.a[0]))}</span><span>${esc(nameOf(c.a[1]))}</span></button>
          <span class="vs">v</span>
          <button class="teambtn${sel === "b" ? " sel" : ""}" data-act="win" data-w="b"><small>Right side</small><span>${esc(nameOf(c.b[0]))}</span><span>${esc(nameOf(c.b[1]))}</span></button>
        </div>
        ${scores ? `<div class="scores"><label class="sr" for="sa">Left side score</label><input type="number" id="sa" inputmode="numeric" min="0" max="99" placeholder="0" value="${sheet.sa ?? ""}"><span class="vs">–</span><label class="sr" for="sb">Right side score</label><input type="number" id="sb" inputmode="numeric" min="0" max="99" placeholder="0" value="${sheet.sb ?? ""}"></div>
          <button class="btn primary" data-act="saveScore">Save result</button>
          <p class="hint" id="scoreHint" style="margin-top:-6px">Enter both scores. The higher score wins.</p>` : `<p class="hint" style="margin-top:-4px">Tap the winning team to save. You can undo straight after.</p>`}
        <div class="sheet-actions">
          <div class="row"><button class="btn sm" data-act="swapMode">Swap a player</button><button class="btn sm" data-act="reshuffle">New teams, same four</button></div>
          <div class="row"><button class="btn sm danger" data-act="cancelGame">Cancel game</button><button class="btn sm ghost" data-act="close">Close</button></div>
        </div>`;
      return;
    }
    if (sheet.type === "confirm") {
      el.innerHTML = `<h3 id="sheetTitle">${esc(sheet.title)}</h3><p style="margin:0">${esc(sheet.body)}</p>
        <div class="sheet-actions"><button class="btn" data-act="close">Keep it</button><button class="btn ${sheet.danger ? "danger" : "primary"}" data-act="confirmYes">${esc(sheet.yes)}</button></div>`;
    }
  }
  function confirmSheet(title, body, yes, fn, danger = true) { openSheet({ type: "confirm", title, body, yes, fn, danger }); }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, withUndo = false) {
    $("#toastMsg").textContent = msg;
    $("#toastUndo").hidden = !withUndo || readOnly;
    $("#toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toast").hidden = true; }, withUndo ? 6000 : 3000);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Summary copied"); }
    catch {
      const fb = $("#copyFallback");
      if (fb) { fb.innerHTML = `<pre class="copy" tabindex="0"></pre><p class="hint">Copy didn't work here. Select the text above and copy it.</p>`; fb.querySelector("pre").textContent = text; const r = document.createRange(); r.selectNodeContents(fb.querySelector("pre")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    }
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t) { if (e.target === $("#backdrop")) closeSheet(); return; }
    const act = t.dataset.act, id = t.dataset.id, i = t.dataset.i != null ? +t.dataset.i : null;
    switch (act) {
      case "view": view = t.dataset.v; lsSet(LS_VIEW, view); render(); window.scrollTo({ top: 0 }); break;
      case "undo": undo(); $("#toast").hidden = true; break;
      case "demo": loadDemo(); break;
      case "clearDemo": confirmSheet("Clear the demo?", "Removes the 30 sample players and their games. Anyone you added yourself stays.", "Clear demo", clearDemo); break;
      case "fillOpen": fillOpen(); break;
      case "fill": fillCourt(i); break;
      case "court": if (!readOnly) openSheet({ type: "court", i, mode: "result", w: state.settings.scores ? t.dataset.w : null }); break;
      case "win":
        if (!state.settings.scores) recordResult(sheet.i, t.dataset.w);
        else { sheet.w = t.dataset.w; sheet.sa = $("#sa").value; sheet.sb = $("#sb").value; renderSheet(); }
        break;
      case "saveScore": {
        const sa = parseInt($("#sa").value, 10), sb = parseInt($("#sb").value, 10);
        if (Number.isNaN(sa) || Number.isNaN(sb) || sa === sb) { const hEl = $("#scoreHint"); hEl.textContent = sa === sb && !Number.isNaN(sa) ? "Scores can't be level. Check the numbers." : "Enter both scores to save."; hEl.style.color = "var(--danger)"; break; }
        recordResult(sheet.i, sa > sb ? "a" : "b", sa, sb);
        break;
      }
      case "swapMode": sheet.mode = "swap"; sheet.out = null; renderSheet(); break;
      case "sheetBack": if (sheet.out) sheet.out = null; else sheet.mode = "result"; renderSheet(); break;
      case "swapOut": sheet.out = id; renderSheet(); break;
      case "swapIn": {
        const ci = sheet.i, out = sheet.out;
        commit(s => { const c = s.courts[ci]; ["a", "b"].forEach(k => { c[k] = c[k].map(x => x === out ? id : x); }); const p = s.roster.find(x => x.id === id); if (p) { p.paused = false; p.in = true; } });
        toast(`${nameOf(id)} in for ${nameOf(out)} on Court ${ci + 1}`, true);
        sheet.mode = "result"; sheet.out = null; renderSheet();
        break;
      }
      case "reshuffle": {
        const ci = sheet.i; const c = state.courts[ci]; const four = [...c.a, ...c.b];
        const opts = splits(four); const key = x => x.slice().sort().join(); const curKey = key(c.a);
        const idx = opts.findIndex(([a, b]) => key(a) === curKey || key(b) === curKey);
        const [a, b] = opts[(Math.max(idx, 0) + 1) % 3];
        commit(s => { s.courts[ci].a = a; s.courts[ci].b = b; });
        renderSheet();
        break;
      }
      case "cancelGame": {
        const ci = sheet.i;
        commit(s => { s.courts[ci] = null; });
        closeSheet(); toast(`Court ${ci + 1} cleared. No result saved.`, true);
        break;
      }
      case "close": closeSheet(); break;
      case "confirmYes": { const fn = sheet && sheet.fn; closeSheet(); fn && fn(); break; }
      case "pause": {
        const p = state.roster.find(x => x.id === id); if (!p) break;
        commit(s => { const q = s.roster.find(x => x.id === id); q.paused = !q.paused; if (!q.paused) q.in = true; });
        toast(p.paused ? `${p.name} is on a break` : `${p.name} is back on the bench`, true);
        break;
      }
      case "toggleIn": commit(s => { const q = s.roster.find(x => x.id === id); q.in = !q.in; if (q.in) q.paused = false; }); break;
      case "checkAll": commit(s => s.roster.forEach(p => { p.in = true; })); break;
      case "checkNone": confirmSheet("Check everyone out?", "Players on court finish their current game, then nobody new is picked.", "Check out all", () => commit(s => s.roster.forEach(p => { p.in = false; p.paused = false; }))); break;
      case "removeAsk": {
        const p = state.roster.find(x => x.id === id); if (!p) break;
        const played = state.matches.some(m => [...m.a, ...m.b].includes(id)), on = onCourtMap().has(id);
        if (played || on) { toast(`${p.name} has games this session. Check them out instead.`); break; }
        confirmSheet(`Remove ${p.name}?`, "They come off your player list completely. You can add them again any time.", "Remove", () => commit(s => { s.roster = s.roster.filter(x => x.id !== id); }));
        break;
      }
      case "paste": {
        const box = $("#pasteBox");
        const names = box.value.split(/[\n,;]+/);
        const n = addNames(names);
        if (names.some(x => x.trim())) { box.value = ""; toast(n ? `Added ${n} new player${n === 1 ? "" : "s"} and checked everyone in` : "Everyone on that list is checked in"); }
        break;
      }
      case "courts": {
        const n = Math.max(1, Math.min(12, state.settings.courts + +t.dataset.d));
        if (n < state.courts.length && state.courts.slice(n).some(Boolean)) { toast(`Finish or cancel the game on Court ${state.courts.length} first`); break; }
        commit(s => { s.settings.courts = n; while (s.courts.length < n) s.courts.push(null); s.courts.length = n; });
        break;
      }
      case "mode": commit(s => { s.settings.mode = t.dataset.m; }); break;
      case "autoFill": commit(s => { s.settings.autoFill = !s.settings.autoFill; }); break;
      case "scores": commit(s => { s.settings.scores = !s.settings.scores; }); break;
      case "sort": standSort = t.dataset.k; renderStandings(); break;
      case "delMatchAsk": {
        const m = state.matches.find(x => x.id === id); if (!m) break;
        confirmSheet("Delete this result?", `Court ${m.court}: ${teamName(m.w === "a" ? m.a : m.b)} def. ${teamName(m.w === "a" ? m.b : m.a)}. Wins and games played update to match.`, "Delete result", () => commit(s => { s.matches = s.matches.filter(x => x.id !== id); }));
        break;
      }
      case "copy": copyText(summaryText(snapshotSession())); break;
      case "copyHist": { const h = history.find(x => x.id === id); if (h) copyText(summaryText(h)); break; }
      case "delHistAsk": confirmSheet("Delete this session from history?", "This can't be undone.", "Delete", () => deleteHistory(id)); break;
      case "newAsk": {
        const live = state.courts.filter(Boolean).length;
        confirmSheet("Save tonight and start fresh?", `${state.matches.length} games go into History.${live ? ` ${live} game${live === 1 ? " is" : "s are"} still in play and won't be counted.` : ""} Your player list stays; check-ins and results reset.`, "Save and start new", async () => {
          const entry = state.matches.length ? snapshotSession() : null;
          commit(s => {
            s.matches = []; s.courts = s.courts.map(() => null); s.startedAt = Date.now(); s.demo = false;
            s.roster = s.roster.filter(p => !p.demo);
            s.roster.forEach(p => { p.in = false; p.paused = false; p.seed = Math.random(); });
          });
          undoStack = []; render();
          if (entry) await saveHistory(entry);
          renderWrap();
          toast(entry ? "Saved to History. New session ready." : "New session ready");
        }, false);
        break;
      }
    }
  });
  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const inp = $("#addName"); const v = inp.value.trim();
    if (!v) return;
    const existed = state.roster.some(p => p.name.toLowerCase() === v.toLowerCase());
    addNames([v]); inp.value = ""; inp.focus();
    toast(existed ? `${v} checked in` : `${v} added and checked in`);
  });
  $("#filter").addEventListener("input", e => { filterText = e.target.value; renderPlayers(onCourtMap()); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });

  // Keep the court timers fresh without writing anything.
  setInterval(() => {
    document.querySelectorAll(".ctime[data-start]").forEach(el => {
      const st = +el.dataset.start; el.textContent = elapsed(st); el.classList.toggle("long", (Date.now() - st) / 60000 >= 20);
    });
  }, 30000);

  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch {}

  render();
  initCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
